<!doctype html>
<html>
<head>

</style>
<script>

</head>
<body>
<form id="incident.do" onsubmit="window.__submits++; return false;">
  <h1>Incident INC0012345</h1>
  <input id="incident.number" value="INC0012345">
  <input type="hidden" id="incident.caller_id" value="681ccaf9c0a8016400b98a06818d57c7">

  <input type="hidden" id="incident.u_affected_user" value="">

  <input id="sys_display.incident.cmdb_ci" value="LT-AMS-04521">
  <select id="incident.state"><option value="1">New</option><option value="2" selected>In Progress</option><option value="3">On Hold</option></select>
  <select id="incident.priority"><option value="2" selected>2 - High</option></select>
  <select id="incident.impact"><option value="2" selected>2 - Medium</option></select>

  <input id="incident.short_description" value="VPN keeps disconnecting when working from home">

  <textarea id="incident.work_notes" style="display:none"></textarea>

    <textarea id="activity-stream-comments-textarea" aria-label="Additional comments"></textarea>
  </div>
  <button type="submit" id="sysverb_update">Update</button>
</form>
<script>
  // Minimal GlideForm emulation with the same API surface as ServiceNow's g_form.
  window.g_ck = 'mock-session-token-1234567890';
  window.g_user = { firstName: 'Umut', lastName: 'Tester', fullName: 'Umut Tester', userName: 'umut.tester' };
  var TABLE = 'incident';
  var FIELDS = ['number','caller_id','u_affected_user','cmdb_ci','state','priority','impact','urgency','assignment_group','assigned_to','short_description','description','work_notes','comments'];
  window.g_form = {
    getTableName: function () { return TABLE; },
    getUniqueValue: function () { return 'e8caedcbc0a80164017df472f39eaed1'; },
    hasField: function (f) { return FIELDS.indexOf(f) >= 0; },
    getControl: function (f) { return document.getElementById(TABLE + '.' + f); },
    getDisplayBox: function (f) { return document.getElementById('sys_display.' + TABLE + '.' + f); },
    getOption: function (f, v) { var c = this.getControl(f); if (!c || !c.options) return null; for (var i=0;i<c.options.length;i++) if (c.options[i].value==v) return c.options[i]; return null; },
    getValue: function (f) { var c = this.getControl(f); return c ? c.value : ''; },
    setValue: function (f, v) {
      var c = this.getControl(f); if (!c) return; c.value = v;
      var vis = document.getElementById('activity-stream-' + f + '-textarea'); if (vis) vis.value = v;
    },
    isNewRecord: function () { return false; }
  };
</script>

</html>
